<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Arena X - Level 10 Finale</title>
<style>
    body { margin:0; overflow:hidden; background:#000; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    canvas { display:block; background:#1b5e20; }
    
    #ui {
        position:absolute; top:20px; left:20px; color:white; 
        font-size:22px; z-index:10; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px;
    }
    
    #level-tag { color: #ffff00; font-size: 28px; font-weight: bold; display: block; margin-bottom: 5px; }
    
    #victory, #gameOver {
        position:absolute; width:100%; height: 100%; top:0; left:0;
        display:none; flex-direction: column; justify-content: center; 
        align-items: center; z-index: 1000; background: rgba(0,0,0,0.85);
    }
    
    #victory h1 { color: #ffff00; font-size: 80px; text-shadow: 0 0 20px #ffaa00; margin: 0; }
    #gameOver h1 { color: #ff0000; font-size: 80px; margin: 0; }
    
    .btn {
        margin-top: 20px; padding: 15px 40px; font-size: 24px; 
        background: white; border: none; cursor: pointer; font-weight: bold;
    }
</style>
</head>
<body>

<div id="ui">
    <span id="level-tag">LEVEL <span id="lvl">1</span> / 10</span>
    ❤️ Health: <span id="health">100</span> | 
    ⭐ Level Kills: <span id="score">0</span> / 10
</div>

<div id="gameOver">
    <h1>ELIMINATED</h1>
    <button class="btn" onclick="location.reload()">TRY AGAIN</button>
</div>

<div id="victory">
    <h1>VICTORY!</h1>
    <p style="color: white; font-size: 24px;">YOU CLEARED ALL 10 LEVELS</p>
    <button class="btn" onclick="location.reload()" style="background: #ffff00;">PLAY AGAIN</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const healthText = document.getElementById("health");
const scoreText = document.getElementById("score");
const levelText = document.getElementById("lvl");
const gameOverScreen = document.getElementById("gameOver");
const victoryScreen = document.getElementById("victory");

let keys = {};
let bullets = [];
let enemyBullets = [];
let enemies = [];
let score = 0;
let level = 1;
let gameRunning = true;

let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 25,
    speed: 6,
    health: 100
};

document.addEventListener("keydown", (e) => { 
    keys[e.key] = true; 
    if(e.code === "Space" && gameRunning) shoot();
});
document.addEventListener("keyup", (e) => { keys[e.key] = false; });

function shoot() {
    bullets.push({ x: player.x, y: player.y, radius: 6, speed: 12 });
}

function spawnEnemy() {
    if (!gameRunning) return;
    
    // Difficulty increases per level
    enemies.push({
        x: Math.random() * canvas.width,
        y: Math.random() * (canvas.height / 3),
        size: 25,
        speed: 1.5 + (level * 0.4), 
        shootTimer: 0,
        shootSpeed: 100 - (level * 6) // Enemies shoot faster every level
    });

    let nextSpawn = 1800 - (level * 120);
    setTimeout(spawnEnemy, Math.max(500, nextSpawn));
}

function checkProgression() {
    if (score >= 10) {
        if (level < 10) {
            level++;
            score = 0;
            player.health = Math.min(100, player.health + 40); // Heal on level up
            
            // Update UI
            levelText.innerText = level;
            scoreText.innerText = score;
            healthText.innerText = player.health;
        } else {
            // FINISHED LEVEL 10
            winGame();
        }
    }
}

function winGame() {
    gameRunning = false;
    victoryScreen.style.display = "flex";
    enemies = [];
    enemyBullets = [];
}

function update() {
    if (!gameRunning) return;

    if (keys["ArrowUp"]) player.y -= player.speed;
    if (keys["ArrowDown"]) player.y += player.speed;
    if (keys["ArrowLeft"]) player.x -= player.speed;
    if (keys["ArrowRight"]) player.x += player.speed;

    // Boundaries
    player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
    player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));

    bullets.forEach((b, i) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(i, 1);
    });

    enemies.forEach((enemy, eIndex) => {
        let dx = player.x - enemy.x;
        let dy = player.y - enemy.y;
        let angle = Math.atan2(dy, dx);

        enemy.x += Math.cos(angle) * enemy.speed;
        enemy.y += Math.sin(angle) * enemy.speed;

        enemy.shootTimer++;
        if (enemy.shootTimer > enemy.shootSpeed) {
            enemyBullets.push({
                x: enemy.x, y: enemy.y,
                dx: Math.cos(angle) * 7,
                dy: Math.sin(angle) * 7,
                radius: 5
            });
            enemy.shootTimer = 0;
        }

        bullets.forEach((bullet, bIndex) => {
            if (Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y) < enemy.size) {
                enemies.splice(eIndex, 1);
                bullets.splice(bIndex, 1);
                score++;
                scoreText.innerText = score;
                checkProgression();
            }
        });
    });

    enemyBullets.forEach((b, i) => {
        b.x += b.dx;
        b.y += b.dy;
        if (Math.hypot(b.x - player.x, b.y - player.y) < player.size) {
            enemyBullets.splice(i, 1);
            player.health -= 15;
            healthText.innerText = player.health;
            if (player.health <= 0) {
                gameRunning = false;
                gameOverScreen.style.display = "flex";
            }
        }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Player
    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fill();

    // Bullets
    ctx.fillStyle = "yellow";
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Enemy Bullets
    ctx.fillStyle = "#ff4400";
    enemyBullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Enemies
    enemies.forEach(enemy => {
        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

spawnEnemy();
gameLoop();
</script>
</body>
</html>
